[package]
name = "geometry-types"
description = "simple geometry collections for 2d graphics"
version = "0.8.1"
edition = "2024"
authors = ["Akisaki Titose <contact@titose.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tito5e/geometry-types"
exclude = [".vscode"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
serde = { version = "1.0.229", optional = true, features = ["derive"] }

[features]
serde = ["dep:serde"]
bytemuck = ["dep:bytemuck"]
